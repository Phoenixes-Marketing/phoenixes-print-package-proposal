<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenixes｜飲料店印刷包套詢價</title><style>
:root{--g:#48a838;--b:#64a5c8;--ink:#173223;--soft:#f4f7f4;--line:#dce7dd}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}header{height:92px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:9}header img{width:250px;height:64px;object-fit:contain}.btn,button{border:0;border-radius:999px;padding:12px 19px;background:var(--g);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.outline{background:#fff;color:var(--g);border:1px solid var(--g)}.hero{padding:76px 6vw;background:linear-gradient(126deg,#eaf6e6,#eef8fb)}.eyebrow{color:var(--g);font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.12;max-width:850px;margin:14px 0}.hero p{max-width:700px;line-height:1.8;font-size:18px}.wrap{max-width:1220px;margin:auto;padding:62px 24px}.notice{border-left:5px solid var(--b);background:#f1f8fb;padding:16px 18px;line-height:1.65;margin:22px 0 36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 5px 16px #1732230a}.photo{aspect-ratio:1;background:#edf4ed;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo small{position:absolute;bottom:0;left:0;right:0;padding:7px 10px;background:#173223bb;color:#fff;font-size:11px}.body{padding:19px}.body h3{margin:8px 0}.muted{color:#57705e;font-size:14px;line-height:1.55}.price{font-weight:800;color:var(--g);font-size:20px;margin:14px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls label{font-size:12px;font-weight:700}.controls select{width:100%;padding:9px;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:#fff}.template{margin-top:15px;display:inline-block;font-size:14px}.summary{margin-top:48px;background:var(--ink);color:#fff;border-radius:20px;padding:28px}.summary ul{padding-left:20px;line-height:1.7}.totals{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:360px;margin-left:auto}.total{border-top:1px solid #ffffff55;padding-top:10px;font-size:21px;font-weight:800}.terms{margin-top:48px;border:1px solid var(--line);padding:34px;line-height:1.85;font-size:13px;background:#fff}.terms h2{margin-top:0}.term{padding:13px 0;border-top:1px solid var(--line)}.term h3{font-size:14px;margin:0 0 5px}.contact{margin-top:48px;padding:38px;background:var(--soft);display:flex;justify-content:space-between;gap:25px;align-items:center}footer{padding:32px 6vw;background:#173223;color:#fff;font-size:13px}@media(max-width:600px){header{height:78px;padding:0 18px}header img{width:175px;height:52px}.hero{padding:52px 24px}.wrap{padding:46px 18px}.controls{grid-template-columns:1fr}.contact{display:block}.contact .btn{display:inline-block;margin-top:12px}}
</style></head><body><header><img id="logo" alt="Phoenixes"><a id="home" class="btn outline" target="_blank">回官方網站</a></header><section class="hero"><div id="eyebrow" class="eyebrow"></div><h1 id="heroTitle"></h1><p id="heroBody"></p><a class="btn" href="#products">開始選擇方案</a></section><main class="wrap"><h2 id="products">選擇你的印刷包套</h2><p class="muted">各品項的規格、數量與價格，請以 Phoenixes 最終確認內容為準。</p><div id="notice" class="notice"></div><div id="cards" class="grid"></div><section class="summary"><h2>你的詢價清單</h2><p id="empty">尚未選擇品項。</p><ul id="list"></ul><div class="totals"><span>商品小計</span><b id="subtotal">NT$0</b><span>稅金</span><b id="tax">NT$0</b><span>暫定運費</span><b id="ship">NT$0</b><span class="total">參考總計</span><b class="total" id="total">NT$0</b></div><p><button id="copy">建立詢價摘要</button></p></section><section class="terms"><h2>印刷注意事項與製作約定</h2><div id="terms"></div></section><section class="contact"><div><div class="eyebrow">LET'S TALK</div><h2>需要協助挑選？直接和我們聊聊。</h2></div><a id="line" class="btn" target="_blank">LINE@ 聯絡</a></section></main><footer id="footer"></footer><script>
let D;const f=n=>'NT$'+n.toLocaleString('zh-TW');fetch('./data.json').then(r=>r.json()).then(d=>{D=d;const s=d.site;document.title=s.title;logo.src=s.logo;home.href=s.homeUrl;line.href=s.lineUrl;eyebrow.textContent=s.eyebrow;heroTitle.textContent=s.heroTitle;heroBody.textContent=s.heroBody;notice.textContent=s.notice;footer.textContent=s.footer;cards.innerHTML=d.products.map(p=>`<article class="card"><div class="photo"><img src="${p.imageUrl}" alt="${p.name} 暫用示意圖"><small>${p.imageNote||''}</small></div><div class="body"><label><input type="checkbox" data-id="${p.id}"> 加入清單</label><h3>${p.name}</h3><p class="muted">${p.description}<br>基準規格：${p.baseSpec}<br>基準數量：${p.baseQuantity}</p><div class="price">${f(p.price)}／${p.unit}</div><div class="controls"><label>規格<select data-spec="${p.id}">${p.specOptions.map(x=>`<option>${x}</option>`).join('')}</select></label><label>數量<select data-qty="${p.id}">${p.quantityOptions.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label></div>${p.templateUrl?`<a class="template btn outline" href="${p.templateUrl}" target="_blank">下載此品項刀模</a>`:'<span class="template muted">此品項刀模連結待更新</span>'}</div></article>`).join('');terms.innerHTML=d.terms.map(t=>`<div class="term"><h3>${t.title}</h3><div>${t.body}</div></div>`).join('');document.addEventListener('change',update);copy.onclick=()=>{const x=pick();if(!x.length)return alert('請先選擇品項');navigator.clipboard.writeText('Phoenixes 飲料店印刷包套詢價\n'+x.map(i=>`- ${i.p.name}｜${i.spec}｜數量 ${i.qty}｜${f(i.p.price*i.qty)}`).join('\n')+'\n參考總計：'+total.textContent).then(()=>alert('詢價摘要已複製，可貼到 LINE@ 或 Email。'));};update();});function pick(){return D.products.filter(p=>document.querySelector(`[data-id="${p.id}"]`).checked).map(p=>({p,qty:+document.querySelector(`[data-qty="${p.id}"]`).value,spec:document.querySelector(`[data-spec="${p.id}"]`).value}));}function update(){if(!D)return;const x=pick(),sub=x.reduce((a,i)=>a+i.p.price*i.qty,0),tax=Math.round(sub*D.pricing.taxRate),ship=sub?D.pricing.shipping:0;empty.style.display=x.length?'none':'block';list.innerHTML=x.map(i=>`<li>${i.p.name}｜${i.spec}｜數量 ${i.qty}｜${f(i.p.price*i.qty)}</li>`).join('');subtotal.textContent=f(sub);tax.textContent=f(tax);ship.textContent=f(ship);total.textContent=f(sub+tax+ship);}
</script></body></html>
