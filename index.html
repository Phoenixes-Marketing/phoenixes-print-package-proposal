<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoenixes｜飲料店印刷包套詢價</title>
<style>
:root{--g:#48a838;--b:#64a5c8;--ink:#173223;--soft:#f4f7f4;--line:#dce7dd}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}header{min-height:118px;padding:14px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:9}header img{width:min(460px,52vw);height:88px;object-fit:contain;object-position:left center}.btn,button{display:inline-block;border:0;border-radius:999px;padding:12px 19px;background:var(--g);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.outline{background:#fff;color:var(--g);border:1px solid var(--g)}.hero{min-height:480px;padding:76px 6vw;background-size:cover;background-position:center right;display:flex;align-items:center}.hero-copy{max-width:720px;padding:28px 32px;background:#ffffffd9;backdrop-filter:blur(3px);border-radius:22px}.eyebrow{color:var(--g);font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.12;margin:14px 0}.hero p{line-height:1.8;font-size:18px}.wrap{max-width:1220px;margin:auto;padding:62px 24px}.notice{border-left:5px solid var(--b);background:#f1f8fb;padding:16px 18px;line-height:1.65;margin:22px 0 36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 5px 16px #1732230a}.photo{aspect-ratio:1;background:#edf4ed;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo small{position:absolute;bottom:0;left:0;right:0;padding:7px 10px;background:#173223bb;color:#fff;font-size:11px}.body{padding:19px}.body h3{margin:8px 0}.muted{color:#57705e;font-size:14px;line-height:1.55}.price{font-weight:800;color:var(--g);font-size:20px;margin:14px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls label{font-size:12px;font-weight:700}.controls select{width:100%;padding:9px;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:#fff}.template{margin-top:15px;font-size:13px}.summary{margin-top:48px;background:#eef6ec;color:var(--ink);border:1px solid #d5e6d3;border-radius:20px;padding:28px}.summary ul{padding-left:20px;line-height:1.7}.totals{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:390px;margin-left:auto;padding:18px;background:#fff;border-radius:14px}.total{border-top:1px solid #bfd3c0;padding-top:10px;font-size:21px;font-weight:800}.summary-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.inquiry-methods{margin-top:48px;padding:38px 42px;border:1px solid var(--line);border-radius:20px;background:#fff}.inquiry-intro{max-width:720px}.inquiry-intro h2{margin:8px 0}.inquiry-intro p{color:#57705e;line-height:1.7}.method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}.method-card{padding:26px;border-radius:16px;background:#f1f8fb;border:1px solid #d8eaf2;display:flex;flex-direction:column}.method-card:nth-child(2){background:#f5f9f2;border-color:#dcead8}.method-no{color:var(--b);font-weight:900;letter-spacing:.08em}.method-card h3{margin:8px 0}.method-card p{min-height:72px;color:#57705e;line-height:1.7;flex:1}.method-card .btn{align-self:flex-start;margin-top:auto}.terms{margin-top:48px;padding:38px 42px;line-height:1.85;font-size:13px;background:#f7f9f7;border-radius:18px}.terms h2{margin-top:0}.term{padding:8px 0}.term h3{font-size:14px;margin:0 0 4px}.contact{margin-top:48px;padding:38px;background:var(--soft);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:1fr auto;gap:25px;align-items:center}.contact-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px}.contact-actions>.btn,.contact-link{font-size:16px}.contact-details{display:flex;align-items:center;justify-content:flex-end;gap:10px 20px;flex-wrap:wrap}.contact-link{color:var(--ink);font-weight:700;text-decoration:none}.contact-link:hover{text-decoration:underline}.phone{color:var(--ink)}footer{padding:32px 6vw;background:#173223;color:#fff;font-size:13px}@media(max-width:680px){header{min-height:88px;padding:8px 18px}header img{width:68vw;height:66px}.hero{padding:38px 18px;min-height:430px}.hero-copy{padding:24px}.wrap{padding:46px 18px}.controls{grid-template-columns:1fr}.method-grid{grid-template-columns:1fr}.method-card p{min-height:0}.method-card .btn{align-self:stretch;text-align:center}.contact{grid-template-columns:1fr}.contact-actions{align-items:stretch}.contact-details{justify-content:flex-start}}
</style>
<style>
body{overflow-x:hidden}header{height:130px;min-height:130px;padding:0 5vw;overflow:hidden}header img{width:min(540px,55vw);height:170px}.card{display:grid;grid-template-rows:auto 1fr}.body{display:grid;grid-template-rows:46px minmax(82px,auto) minmax(116px,1fr) 32px auto 48px;padding:19px}.body h3{min-height:82px;margin:8px 0 4px;line-height:1.3;display:flex;align-items:center;overflow-wrap:anywhere}.body>.muted{min-height:116px;margin:0}.price{height:32px;margin:0;display:flex;align-items:center}.template{width:100%;min-height:42px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center}.template-link{background:var(--b);color:#fff;border:1px solid var(--b)}.template-disabled{border:1px solid #c8dcc9;border-radius:999px;color:#47764a;background:#eaf4e8;cursor:not-allowed;font-weight:700;padding:10px 14px}.add-to-list{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;font-weight:700;color:var(--ink);cursor:pointer}.add-to-list input{appearance:none;width:48px;height:28px;margin:0;border-radius:999px;background:#bcc9be;position:relative;flex:0 0 auto;transition:.2s}.add-to-list input:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #17322355;transition:.2s}.add-to-list input:checked{background:var(--g)}.add-to-list input:checked:after{transform:translateX(20px)}.add-to-list:has(input:checked){color:#287723}
@media(max-width:1100px){.contact{grid-template-columns:1fr}.contact-actions{align-items:flex-start}.contact-details{justify-content:flex-start}}@media(max-width:680px){header{height:92px;min-height:92px;padding:0 14px;gap:10px}header img{width:68vw;height:102px}header .btn{padding:9px 12px;font-size:13px;white-space:nowrap}.hero{padding:28px 14px;min-height:410px}.hero-copy{padding:22px 20px}.hero h1{font-size:clamp(32px,10vw,46px)}.hero p{font-size:16px}.wrap{padding:40px 14px}.grid{grid-template-columns:1fr}.body{grid-template-rows:auto auto auto auto auto auto}.body h3,.body>.muted{min-height:0}.price{height:auto;margin:14px 0}.summary{padding:24px 20px}.terms{padding:28px 20px}.contact{padding:28px 20px}.contact-actions,.contact-actions .btn{width:100%}.contact-actions .btn{justify-content:center;text-align:center}}
</style>
</head>
<body>
<header><img id="logo" alt="Phoenixes 封王"><a id="home" class="btn outline" target="_blank" rel="noreferrer">回官方網站</a></header>
<section class="hero"><div class="hero-copy"><div id="eyebrow" class="eyebrow"></div><h1 id="heroTitle"></h1><p id="heroBody"></p><a class="btn" href="#products">開始選擇方案</a></div></section>
<main class="wrap">
<h2 id="products">選擇你的印刷包套</h2><p class="muted">各品項的規格、數量與價格，請以 Phoenixes 最終確認內容為準。</p><div id="notice" class="notice"></div><div id="cards" class="grid"></div>
<section class="summary"><h2>你的詢價清單</h2><p id="empty">尚未選擇品項。</p><ul id="list"></ul><div class="totals"><span>商品小計（未稅）</span><b id="subtotal">NT$0</b><span id="taxLabel">稅金</span><b id="tax">NT$0</b><span>暫定運費</span><b id="ship">NT$0</b><span class="total">參考總計</span><b class="total" id="total">NT$0</b></div><div class="summary-actions"><button id="copy">複製詢價摘要</button></div></section>
<section class="inquiry-methods" aria-labelledby="inquiryTitle"><div class="inquiry-intro"><div class="eyebrow">HOW TO INQUIRE</div><h2 id="inquiryTitle"></h2><p id="inquiryIntro"></p></div><div class="method-grid"><article class="method-card"><div class="method-no">01</div><h3 id="lineMethodTitle"></h3><p id="lineMethodBody"></p><a id="lineMethod" class="btn" target="_blank" rel="noreferrer">立即透過 LINE@ 聯繫封王</a></article><article class="method-card"><div class="method-no">02</div><h3 id="formMethodTitle"></h3><p id="formMethodBody"></p><a id="form" class="btn outline" hidden target="_blank" rel="noreferrer">填寫詢價表單並上傳檔案</a></article></div></section>
<section class="terms"><h2>印刷注意事項與製作約定</h2><div id="terms"></div></section>
<section class="contact"><div><div class="eyebrow">LET'S TALK</div><h2>需要協助挑選？直接和我們聊聊。</h2></div><div class="contact-actions"><a id="line" class="btn" target="_blank" rel="noreferrer">立即透過 LINE@ 聯繫封王</a><div class="contact-details"><a id="email" class="contact-link" hidden>Email 聯繫</a><a id="phone" class="contact-link phone"></a></div></div></section>
</main><footer id="footer"></footer>
<script>
let D;const f=n=>'NT$'+n.toLocaleString('zh-TW');
fetch('./data.json').then(r=>r.json()).then(d=>{D=d;const s=d.site;document.title=s.title;logo.src=s.logo;home.href=s.homeUrl;line.href=s.lineUrl;lineMethod.href=s.lineUrl;phone.href='tel:'+s.servicePhone.replaceAll('-','');phone.textContent='服務專線 '+s.servicePhone;if(s.contactEmail){email.hidden=false;email.href='mailto:'+s.contactEmail}if(s.inquiryFormUrl){form.hidden=false;form.href=s.inquiryFormUrl}taxLabel.textContent=`稅金（商品小計 × ${D.pricing.taxRate*100}%）`;document.querySelector('.hero').style.backgroundImage=`linear-gradient(90deg,#eaf6e6e8 0%,#eef8fbd2 48%,#ffffff22 100%),url(${s.heroImageUrl})`;eyebrow.textContent=s.eyebrow;heroTitle.textContent=s.heroTitle;heroBody.textContent=s.heroBody;notice.textContent=s.notice;inquiryTitle.textContent=s.inquiryTitle;inquiryIntro.textContent=s.inquiryIntro;lineMethodTitle.textContent=s.lineMethodTitle;lineMethodBody.textContent=s.lineMethodBody;formMethodTitle.textContent=s.formMethodTitle;formMethodBody.textContent=s.formMethodBody;footer.textContent=s.footer;
cards.innerHTML=d.products.map(p=>`<article class="card"><div class="photo"><img src="${p.imageUrl}" alt="${p.name} 暫用示意圖"><small>${p.imageNote||''}</small></div><div class="body">${p.templateUrl?`<a class="template btn template-link" href="${p.templateUrl}" target="_blank" rel="noreferrer">${p.templateLabel||'下載此品項刀模'}</a>`:'<span class="template template-disabled" aria-disabled="true">刀模連結待提供</span>'}<h3>${p.name}</h3><p class="muted">${p.description}<br>基準規格：${p.baseSpec}<br>基準數量：${p.baseQuantity}</p><div class="price">${f(p.price)}／${p.unit}</div><div class="controls"><label>規格<select data-spec="${p.id}">${p.specOptions.map(x=>`<option>${x}</option>`).join('')}</select></label><label>數量<select data-qty="${p.id}">${p.quantityOptions.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label></div><label class="add-to-list"><input type="checkbox" role="switch" data-id="${p.id}"><span>加入詢價清單</span></label></div></article>`).join('');
terms.innerHTML=d.terms.map((t,i)=>`<div class="term"><h3>${i+1}. ${t.title}</h3><div>${t.body}</div></div>`).join('');document.addEventListener('change',update);copy.onclick=()=>{const x=pick();if(!x.length)return alert('請先選擇品項');navigator.clipboard.writeText(summaryText(x)).then(()=>alert('詢價摘要已複製，可貼到 LINE@ 或詢價表單。'))};update();
});
function pick(){return D.products.filter(p=>document.querySelector(`[data-id="${p.id}"]`).checked).map(p=>({p,qty:+document.querySelector(`[data-qty="${p.id}"]`).value,spec:document.querySelector(`[data-spec="${p.id}"]`).value}))}
function summaryText(x){return 'Phoenixes 飲料店印刷包套詢價\n'+x.map(i=>`- ${i.p.name}｜${i.spec}｜數量 ${i.qty}｜${f(i.p.price*i.qty)}`).join('\n')+`\n商品小計（未稅）：${subtotal.textContent}\n稅金：${tax.textContent}\n暫定運費：${ship.textContent}\n參考總計：${total.textContent}`}
function update(){if(!D)return;const x=pick(),sub=x.reduce((a,i)=>a+i.p.price*i.qty,0),taxAmount=Math.round(sub*D.pricing.taxRate),shipping=sub?D.pricing.shipping:0;empty.style.display=x.length?'none':'block';list.innerHTML=x.map(i=>`<li>${i.p.name}｜${i.spec}｜數量 ${i.qty}｜${f(i.p.price*i.qty)}</li>`).join('');subtotal.textContent=f(sub);tax.textContent=f(taxAmount);ship.textContent=f(shipping);total.textContent=f(sub+taxAmount+shipping)}
</script>
</body></html>
